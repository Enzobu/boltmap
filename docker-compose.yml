services:
  image-volume-init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${IMAGE_VOLUME:-./volume_images}:/uploads
    command: ["sh", "-c", "mkdir -p /uploads && chown -R 1001:1001 /uploads"]

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${DATABASE_VOLUME:-./volume_database}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
    depends_on:
      image-volume-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - ${IMAGE_VOLUME:-./volume_images}:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
