name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "ci/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag boltmap:ci .

  quality:
    name: Quality
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: mysql://boltmap:boltmap@127.0.0.1:3306/boltmap
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    needs:
      - build
      - quality
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy prod
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/deploy-response.txt -w "%{http_code}" -X POST "https://dokploy.enzo-palermo.com/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_PROD_API_KEY }}" \
            -d '{"composeId":"${{ secrets.DOKPLOY_PROD_COMPOSE_ID }}"}')

          echo "HTTP code: $HTTP_CODE"
          cat /tmp/deploy-response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
